# Nextuon Arcade — Authentik-gated retro game library
# Pulls the published image from Docker Hub. No local build required.
#
# Setup:
#   1. Authenticate to the Gitea container registry once (uses a Gitea token
#      with the `read:package` scope as the password):
#        docker login git.nextuon.com -u <your-gitea-username>
#   2. Copy .env.example to .env and fill in values from your Authentik instance.
#      See https://github.com/brandonjensengit/retroassembly/blob/main/docs/sso-setup.md
#      for how to create the Application + Provider + Group.
#   3. docker compose up -d
#   4. Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front of
#      port 8000. Recipes in docs/docker.md.
#
# Updating to a newer image:  docker compose pull && docker compose up -d
# Logs:                       docker compose logs -f
# Teardown (keeps data):      docker compose down
# Wipe data:                  docker compose down -v   # WARNING destructive

services:
  nextuon-arcade:
    image: git.nextuon.com/braniam/nextuon-arcade:latest
    container_name: nextuon-arcade
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - nextuon-arcade-data:/app/data
    env_file:
      - .env

volumes:
  nextuon-arcade-data:
